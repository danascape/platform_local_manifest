# Repository mirror map, read by mirror.py.
#
# Each entry has one source repo, the branches to take from it, and the
# targets to push those branches to.
#
# branches:
#   - lineage-23.2               push to the same branch name on the target
#   - lineage-23.2:main          push source lineage-23.2 to target main
#
# mode (set in defaults, per repo, or per target):
#   push     normal push, fails if the target branch has diverged
#   force    force-push the listed branches (default, the usual choice for mirrors)
#   mirror   ignore `branches`; make the target an exact copy of ALL source
#            branches and tags, deleting anything on the target the source lacks
#
# tags: true    also push tags (in push/force mode)
# prune: true   delete branches on the target that are not in `branches`
#               (push/force mode; mirror mode always prunes)
#
# A target can be a plain URL, or a map that overrides url/mode/branches/tags/prune.

defaults:
  mode: force
  tags: false
  prune: true

repos:
  - source: https://github.com/danascape/android_device_oneplus_billie
    branches: &billie_branches
      - lineage-17.1-prebuilt
      - lineage-17.1
      - lineage-18.1
      - lineage-19.1
      - lineage-20
      - lineage-21
      - lineage-22.2
      - lineage-23.2
      - lineage-24.0
    targets:
      - https://github.com/danascape-projects/android_device_oneplus_billie
      - https://github.com/oneplus-sm6350-devs/android_device_oneplus_billie

  - source: https://github.com/danascape/proprietary_vendor_oneplus_billie
    branches: *billie_branches
    targets:
      - https://github.com/oneplus-sm6350-devs/proprietary_vendor_oneplus_billie
      - https://github.com/danascape-projects/proprietary_vendor_oneplus_billie

  - source: https://github.com/danascape/android_device_nothing_asteroids
    branches: [lineage-24.0]
    targets:
      - https://github.com/danascape-projects/android_device_nothing_asteroids

  - source: https://github.com/danascape/platform_hardware_nothing
    branches: [lineage-24.0]
    targets:
      - https://github.com/danascape-projects/android_hardware_nothing

  - source: https://github.com/danascape/proprietary_vendor_nothing_asteroids
    branches: [lineage-24.0]
    targets:
      - https://github.com/danascape-projects/proprietary_vendor_nothing_asteroids

  # Example with overrides:
  # - source: https://github.com/danascape/android_kernel_oneplus_sm6350
  #   branches: [lineage-23.2, lineage-24.0]
  #   targets:
  #     - https://github.com/oneplus-sm6350-devs/android_kernel_oneplus_sm6350
  #     - url: https://github.com/danascape-projects/android_kernel_oneplus_sm6350
  #       mode: mirror
  #     - url: https://github.com/someone/android_kernel_oneplus_sm6350
  #       branches: ["lineage-24.0:main"]
  #       mode: push
